<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KMK - Digitales SMV Forum</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b',
                        accent: '#4f46e5',
                        accenthover: '#4338ca'
                    }
                }
            }
        }
    </script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body class="bg-darkbg text-slate-100 min-h-screen font-sans antialiased pb-20 md:pb-0">

<header class="bg-cardbg border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
        
        <!-- Logo und Text eng zusammengefügt -->
        <div class="flex items-center space-x-3">
            <img src="logo.png" alt="SMV Logo" class="h-11 w-auto object-contain">
            <div>
                <h1 class="font-bold text-lg tracking-tight leading-tight">KMK-Realschule</h1>
                <p class="text-xs text-slate-400">Digitales SMV Forum</p>
            </div>
        </div>

        <!-- Desktop Navigation (bleibt rechts) -->
        <nav class="hidden md:flex space-x-1">
            <button onclick="switchTab('ideen')" id="nav-ideen" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium transition bg-accent text-white flex items-center space-x-2">
                <i data-lucide="lightbulb" class="w-4 h-4"></i> <span>Ideen & Abstimmungen</span>
            </button>
            <button onclick="switchTab('aktionen')" id="nav-aktionen" class="nav-btn px-3 py-2 rounded-lg text-sm font-medium transition text-slate-400 hover:text-white hover:bg-slate-800 flex items-center space-x-2">
                <i data-lucide="calendar" class="w-4 h-4"></i> <span>Aktionen & Helfer</span>
            </button>
        </nav>

    </div>
</header>

    <!-- Mobile Bottom Navigation -->
    <div class="md:hidden fixed bottom-0 left-0 right-0 bg-cardbg border-t border-slate-800 z-50 flex justify-around p-2">
        <button onclick="switchTab('ideen')" id="mob-ideen" class="mob-btn p-2 text-accent flex flex-col items-center text-xs">
            <i data-lucide="lightbulb" class="w-5 h-5"></i> <span>Ideen</span>
        </button>
        <button onclick="switchTab('aktionen')" id="mob-aktionen" class="mob-btn p-2 text-slate-400 flex flex-col items-center text-xs">
            <i data-lucide="calendar" class="w-5 h-5"></i> <span>Aktionen</span>
        </button>
    </div>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- 1. IDEEN-BOX & ABSTIMMUNG TAB -->
        <div id="tab-ideen" class="tab-content">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold">Ideen & Abstimmungen</h2>
                    <p class="text-slate-400 text-sm">Reiche deine Vorschläge für die Schule ein und stimme direkt darüber ab.</p>
                </div>
                <button onclick="openModal('ideaModal')" class="bg-accent hover:bg-accenthover text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center space-x-2 transition shadow-lg shadow-indigo-500/20">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span>Idee zur Abstimmung einreichen</span>
                </button>
            </div>
            <!-- Filter Bar -->
            <div class="flex space-x-2 mb-6 overflow-x-auto pb-2">
                <button onclick="filterIdeas('all')" class="filter-btn-idea active px-3 py-1.5 rounded-lg text-xs font-medium bg-accent text-white">Alle</button>
                <button onclick="filterIdeas('Aktionen')" class="filter-btn-idea px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Aktionen</button>
                <button onclick="filterIdeas('Schulhof')" class="filter-btn-idea px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Schulhof</button>
                <button onclick="filterIdeas('Sonstiges')" class="filter-btn-idea px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Sonstiges</button>
            </div>
            <!-- Grid -->
            <div id="ideasGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Dynamically populated -->
            </div>
        </div>

        <!-- 2. AKTIONEN & HELFER TAB -->
        <div id="tab-aktionen" class="tab-content hidden">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                    <h2 class="text-2xl font-bold">Aktionen & Helferplaner</h2>
                    <p class="text-slate-400 text-sm">Trage dich für SMV-Aktionen ein und hilf bei der Umsetzung.</p>
                </div>
                <button onclick="openModal('actionModal')" class="bg-accent hover:bg-accenthover text-white px-4 py-2 rounded-xl text-sm font-medium flex items-center space-x-2 transition shadow-lg shadow-indigo-500/20">
                    <i data-lucide="plus" class="w-4 h-4"></i> <span>Aktion erstellen</span>
                </button>
            </div>
            <div id="actionsContainer" class="space-y-6">
                <!-- Dynamically populated -->
            </div>
        </div>

    </main>

    <!-- MODAL: Idee einreichen -->
    <div id="ideaModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg border border-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl">
            <h3 class="text-lg font-bold mb-4">Neue Idee einreichen</h3>
            <form onsubmit="submitIdea(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Titel</label>
                    <input type="text" id="newIdeaTitle" required placeholder="z.B. eine weitere Aktion" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Kategorie</label>
                    <select id="newIdeaCategory" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                        <option value="Aktionen">Aktionen</option>
                        <option value="Schulhof">Schulhof</option>
                        <option value="Sonstiges">Sonstiges</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Beschreibung</label>
                    <textarea id="newIdeaDesc" rows="3" required placeholder="Erkläre kurz deine Idee..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('ideaModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Abbrechen</button>
                    <button type="submit" class="px-4 py-2 rounded-xl text-sm font-medium bg-accent text-white hover:bg-accenthover">Einreichen</button>
                </div>
            </form>
        </div>
    </div>

    <!-- MODAL: Aktion erstellen -->
    <div id="actionModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4">SMV-Aktion & Helferplan erstellen</h3>
            <form onsubmit="submitAction(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Aktions-Titel</label>
                    <input type="text" id="newActionTitle" required placeholder="z.B. Sommer-Schulfest" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Datum</label>
                        <input type="date" id="newActionDate" required class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Ort</label>
                        <input type="text" id="newActionLocation" required placeholder="z.B. Pausenhof" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Beschreibung</label>
                    <textarea id="newActionDesc" rows="2" required placeholder="Worum geht es bei der Aktion?" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent"></textarea>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Aufgabenbereiche (Kommagetrennt mit Max-Anzahl in Klammern, z.B. Aufbau (3), Kuchenverkauf (4))</label>
                    <input type="text" id="newActionSlots" required placeholder="Aufbau (3), Technik (2), Grillmeister (2)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-accent">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeModal('actionModal')" class="px-4 py-2 rounded-xl text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700">Abbrechen</button>
                    <button type="submit" class="px-4 py-2 rounded-xl text-sm font-medium bg-accent text-white hover:bg-accenthover">Aktion veröffentlichen</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Data Store (mit localStorage Fallback) - Standardmäßig leer
        let ideas = JSON.parse(localStorage.getItem('smv_ideas')) || [];
        let actions = JSON.parse(localStorage.getItem('smv_actions')) || [];

        // Tab Switching Logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById('tab-' + tabId).classList.remove('hidden');

            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('bg-accent', 'text-white');
                btn.classList.add('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
            });
            const activeNav = document.getElementById('nav-' + tabId);
            if(activeNav) {
                activeNav.classList.add('bg-accent', 'text-white');
                activeNav.classList.remove('text-slate-400', 'hover:text-white', 'hover:bg-slate-800');
            }

            document.querySelectorAll('.mob-btn').forEach(btn => {
                btn.classList.remove('text-accent');
                btn.classList.add('text-slate-400');
            });
            const activeMob = document.getElementById('mob-' + tabId);
            if(activeMob) {
                activeMob.classList.add('text-accent');
                activeMob.classList.remove('text-slate-400');
            }
            window.scrollTo(0, 0);
        }

        // Render Ideas with Abstimmung (Ja / Nein)
        function renderIdeas(filter = 'all') {
            const grid = document.getElementById('ideasGrid');
            grid.innerHTML = '';
            const filtered = filter === 'all' ? ideas : ideas.filter(i => i.category === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-500 bg-cardbg/50 border border-slate-800/80 rounded-2xl">
                        <i data-lucide="lightbulb" class="w-10 h-10 mx-auto mb-3 stroke-1 text-slate-600"></i>
                        <p class="text-sm font-medium">Noch keine Ideen vorhanden.</p>
                        <p class="text-xs text-slate-600 mt-1">Sei der Erste und reiche eine neue Idee zur Abstimmung ein!</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            filtered.forEach(idea => {
                const totalVotes = (idea.yes || 0) + (idea.no || 0);
                const yesPct = totalVotes > 0 ? Math.round(((idea.yes || 0) / totalVotes) * 100) : 0;

                grid.innerHTML += `
                    <div class="bg-cardbg border border-slate-800 rounded-2xl p-5 flex flex-col justify-between shadow-lg">
                        <div>
                            <div class="flex justify-between items-start mb-3">
                                <span class="bg-indigo-500/10 text-indigo-400 text-xs px-2.5 py-1 rounded-lg font-medium">${idea.category}</span>
                                <span class="text-xs text-slate-500">ID #${idea.id}</span>
                            </div>
                            <h3 class="font-bold text-base mb-2">${idea.title}</h3>
                            <p class="text-slate-400 text-sm mb-4">${idea.desc}</p>
                        </div>

                        <!-- Abstimmungsbereich -->
                        <div class="pt-3 border-t border-slate-800/60">
                            <div class="flex justify-between text-xs text-slate-400 mb-1">
                                <span>Zustimmung: ${yesPct}%</span>
                                <span>Gefällt ${idea.yes || 0} von ${totalVotes}</span>
                            </div>
                            <div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden mb-3 flex">
                                <div style="width: ${yesPct}%" class="bg-emerald-500 h-full transition-all"></div>
                                <div style="width: ${100 - yesPct}%" class="bg-rose-500 h-full transition-all"></div>
                            </div>
                            <div class="flex space-x-2">
                                <button onclick="voteIdea(${idea.id}, 'yes')" class="flex-1 flex items-center justify-center space-x-1 py-1.5 rounded-xl text-xs font-medium transition ${idea.userVote === 'yes' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                                    <i data-lucide="thumbs-up" class="w-3.5 h-3.5"></i>
                                    <span>Dafür (${idea.yes || 0})</span>
                                </button>
                                <button onclick="voteIdea(${idea.id}, 'no')" class="flex-1 flex items-center justify-center space-x-1 py-1.5 rounded-xl text-xs font-medium transition ${idea.userVote === 'no' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/40' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'}">
                                    <i data-lucide="thumbs-down" class="w-3.5 h-3.5"></i>
                                    <span>Dagegen (${idea.no || 0})</span>
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function filterIdeas(cat) {
            document.querySelectorAll('.filter-btn-idea').forEach(btn => {
                btn.classList.remove('bg-accent', 'text-white');
                btn.classList.add('bg-slate-800', 'text-slate-300');
            });
            event.target.classList.remove('bg-slate-800', 'text-slate-300');
            event.target.classList.add('bg-accent', 'text-white');
            renderIdeas(cat);
        }

        function voteIdea(id, type) {
            const idea = ideas.find(i => i.id === id);
            if(!idea) return;

            if(!idea.yes) idea.yes = 0;
            if(!idea.no) idea.no = 0;

            if (idea.userVote === type) {
                // Stimme zurückziehen
                idea[type]--;
                idea.userVote = null;
            } else {
                // Vorherige Stimme entfernen, falls vorhanden
                if (idea.userVote) {
                    idea[idea.userVote]--;
                }
                idea[type]++;
                idea.userVote = type;
            }

            localStorage.setItem('smv_ideas', JSON.stringify(ideas));
            renderIdeas();
        }

        function submitIdea(e) {
            e.preventDefault();
            const title = document.getElementById('newIdeaTitle').value;
            const category = document.getElementById('newIdeaCategory').value;
            const desc = document.getElementById('newIdeaDesc').value;

            ideas.unshift({
                id: Date.now().toString().slice(-4),
                title,
                category,
                desc,
                yes: 1,
                no: 0,
                userVote: 'yes'
            });

            localStorage.setItem('smv_ideas', JSON.stringify(ideas));
            closeModal('ideaModal');
            document.getElementById('newIdeaTitle').value = '';
            document.getElementById('newIdeaDesc').value = '';
            renderIdeas();
        }

        // Render Actions & Helpers
        function renderActions() {
            const container = document.getElementById('actionsContainer');
            container.innerHTML = '';

            if (actions.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-12 text-slate-500 bg-cardbg/50 border border-slate-800/80 rounded-2xl">
                        <i data-lucide="calendar" class="w-10 h-10 mx-auto mb-3 stroke-1 text-slate-600"></i>
                        <p class="text-sm font-medium">Aktuell sind keine Aktionen geplant.</p>
                        <p class="text-xs text-slate-600 mt-1">Erstelle eine neue Aktion, um Helfer zu organisieren!</p>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            actions.forEach(action => {
                let slotsHtml = '';
                action.slots.forEach((slot, sIdx) => {
                    const isFull = slot.helpers.length >= slot.max;
                    let helpersList = slot.helpers.map((h, hIdx) => `
                        <span class="inline-flex items-center bg-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-lg mr-1 mb-1">
                            ${h} 
                            <button onclick="removeHelper(${action.id}, ${sIdx}, ${hIdx})" class="ml-1.5 text-slate-400 hover:text-red-400">&times;</button>
                        </span>
                    `).join('');

                    slotsHtml += `
                        <div class="bg-slate-900/60 border border-slate-800/80 rounded-xl p-4 mb-3">
                            <div class="flex justify-between items-center mb-2">
                                <span class="font-medium text-sm">${slot.name}</span>
                                <span class="text-xs ${isFull ? 'text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded' : 'text-slate-400'}">
                                    ${slot.helpers.length} / ${slot.max} Plätze
                                </span>
                            </div>
                            <div class="mb-3 flex flex-wrap">${helpersList || '<span class="text-xs text-slate-500 italic">Noch keine Helfer eingetragen</span>'}</div>
                            ${!isFull ? `
                                <div class="flex gap-2">
                                    <input type="text" id="helperName-${action.id}-${sIdx}" placeholder="Dein Name & Klasse (z.B. Tom 7a)" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-white focus:outline-none focus:border-accent">
                                    <button onclick="addHelper(${action.id},${sIdx})" class="bg-accent hover:bg-accenthover text-white px-3 py-1.5 rounded-lg text-xs font-medium">Eintragen</button>
                                </div>
                            ` : '<div class="text-xs text-emerald-400 font-medium">Bereich voll besetzt! &check;</div>'}
                        </div>
                    `;
                });

                container.innerHTML += `
                    <div class="bg-cardbg border border-slate-800 rounded-2xl p-6 shadow-lg">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-4 gap-2">
                            <div>
                                <h3 class="text-lg font-bold">${action.title}</h3>
                                <p class="text-xs text-indigo-400 flex items-center space-x-1 mt-1">
                                    <i data-lucide="calendar" class="w-3.5 h-3.5"></i> <span>${action.date}</span> &bull; 
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 ml-1"></i> <span>${action.location}</span>
                                </p>
                            </div>
                        </div>
                        <p class="text-slate-400 text-sm mb-4">${action.desc}</p>
                        <div class="border-t border-slate-800/80 pt-4">
                            <h4 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Aufgabenbereiche & Helfer</h4>
                            ${slotsHtml}
                        </div>
                    </div>
                `;
            });
            lucide.createIcons();
        }

        function addHelper(actionId, slotIdx) {
            const input = document.getElementById(`helperName-${actionId}-${slotIdx}`);
            const val = input.value.trim();
            if(!val) return;

            const action = actions.find(a => a.id === actionId);
            if(action && action.slots[slotIdx].helpers.length < action.slots[slotIdx].max) {
                action.slots[slotIdx].helpers.push(val);
                localStorage.setItem('smv_actions', JSON.stringify(actions));
                renderActions();
            }
        }

        function removeHelper(actionId, slotIdx, helperIdx) {
            const action = actions.find(a => a.id === actionId);
            if(action) {
                action.slots[slotIdx].helpers.splice(helperIdx, 1);
                localStorage.setItem('smv_actions', JSON.stringify(actions));
                renderActions();
            }
        }

        function submitAction(e) {
            e.preventDefault();
            const title = document.getElementById('newActionTitle').value;
            const date = document.getElementById('newActionDate').value;
            const location = document.getElementById('newActionLocation').value;
            const desc = document.getElementById('newActionDesc').value;
            const rawSlots = document.getElementById('newActionSlots').value;

            let parsedSlots = [];
            rawSlots.split(',').forEach(part => {
                const match = part.match(/(.*?)\s*\((\d+)\)/);
                if(match) {
                    parsedSlots.push({ name: match[1].trim(), max: parseInt(match[2]), helpers: [] });
                } else if(part.trim()) {
                    parsedSlots.push({ name: part.trim(), max: 3, helpers: [] });
                }
            });

            actions.unshift({
                id: Date.now(),
                title,
                date,
                location,
                desc,
                slots: parsedSlots.length > 0 ? parsedSlots : [{ name: 'Helfer Allgemein', max: 5, helpers: [] }]
            });

            localStorage.setItem('smv_actions', JSON.stringify(actions));
            closeModal('actionModal');
            renderActions();
        }

        // Modal Controls
        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        // Init on Load
        window.onload = function() {
            renderIdeas();
            renderActions();
            lucide.createIcons();
        };

        // Service Worker Registrierung
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
              .then(() => console.log('Service Worker registriert!'));
        }
    </script>
</body>
</html>
